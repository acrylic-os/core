<!DOCTYPE html>
<html lang="en">
    <head id="head">
        <title>Acrylic</title>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <link rel="stylesheet" href="common.css" fetchpriority="high">
        <link rel="icon" href="https://acrylic.anpang.lol/stable/core/assets/acrylic_logo.svg">
    </head>
    <body id="body">
        
        <script>
            
            let example = "main.caro";

            let file = `${example}`.split("/").pop();
            var Module = {
                preRun: [() => {
                    addRunDependency(file);
                    fetch(`./${example}`)
                        .then(response => {
                            if (!response.ok) throw new Error(`Failed to fetch ${example}: ${response.status}`);
                            return response.text();
                        })
                        .then(code => {
                            FS.writeFile(file, code);
                            removeRunDependency(file);
                        });
                }],
                arguments: [file],
            };

        </script>
        <script src="caro-web/caro-web.js"></script>

    </body>
</html>
